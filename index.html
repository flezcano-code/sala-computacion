<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sala de Computación · Horario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F5F9;
    --surface: #FFFFFF;
    --ink: #16213E;
    --ink-soft: #5B6785;
    --border: #DCE3EC;
    --teal: #0EA5A0;
    --teal-soft: #E3F6F4;
    --coral: #E4572E;
    --coral-soft: #FCEAE3;
    --amber: #F4A300;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(22,33,62,0.06), 0 10px 30px rgba(22,33,62,0.04);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(22,33,62,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding: 28px 20px 60px;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }

  .logo{
    height: 64px;
    width: 64px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .header-center{
    flex: 1;
    min-width: 220px;
    text-align:center;
  }

  .header-center .subtitle{ margin-left:auto; margin-right:auto; }

  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .week-nav label{
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  #selector-fecha{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    cursor:pointer;
  }
  #selector-fecha:focus{ outline: 2px solid var(--teal); border-color: var(--teal); }
  .btn-week-today{
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--ink); color:#fff; border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 8px 14px;
    cursor:pointer;
  }
  .btn-week-today:hover{ background:#0F1730; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    font-weight: 600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:8px; height:8px; border-radius:2px;
    background: var(--teal);
    display:inline-block;
  }

  h1{
    font-family:'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 38px);
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle{ color: var(--ink-soft); font-size:15px; max-width: 520px; }

  .legend{
    display:flex; gap:18px; flex-wrap:wrap;
    font-size: 13px; color: var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
  }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .dot{ width:11px; height:11px; border-radius:3px; display:inline-block; }
  .dot.free{ background: var(--teal); }
  .dot.taken{ background: var(--coral); }
  .dot.now{ background: var(--amber); }

  #status-banner{
    display:none;
    background: var(--surface);
    border:1px solid var(--border);
    border-left: 4px solid var(--teal);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  #status-banner.error{ border-left-color: var(--coral); color:#9A3412; }
  #status-banner.show{ display:block; }

  .board-shell{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 6px;
    overflow-x: auto;
  }

  table.board{
    border-collapse: separate;
    border-spacing: 6px;
    width: 100%;
    min-width: 760px;
  }

  table.board th{
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink);
    padding: 10px 6px;
    text-align:center;
  }

  table.board th.day-header.today{ color: var(--teal); }

  td.block-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align:right;
    padding-right: 10px;
    white-space: nowrap;
    width: 90px;
  }
  td.block-label b{
    display:block; color: var(--ink); font-size: 13.5px;
  }

  .recreo-row td{ padding: 0; }
  .recreo-label{
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
  }
  .recreo-cell{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: repeating-linear-gradient(
      45deg,
      rgba(22,33,62,0.03),
      rgba(22,33,62,0.03) 6px,
      transparent 6px,
      transparent 12px
    );
    border-radius: 8px;
    padding: 6px;
  }

  .cell{
    border-radius: 10px;
    min-height: 64px;
    padding: 8px 10px;
    cursor: pointer;
    border: 1.5px dashed var(--teal);
    background: var(--teal-soft);
    transition: transform .08s ease, box-shadow .08s ease;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
  }
  .cell:hover{ transform: translateY(-1px); box-shadow: 0 4px 14px rgba(14,165,160,0.18); }

  .cell.taken{
    cursor:pointer;
    border: 1.5px solid var(--coral);
    background: var(--coral-soft);
  }
  .cell.taken:hover{ box-shadow: 0 4px 14px rgba(228,87,46,0.18); }

  .cell .free-txt{
    font-size: 12.5px;
    color: var(--teal);
    font-weight: 600;
    font-family:'JetBrains Mono', monospace;
  }
  .cell .curso{
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: #9A2E14;
  }
  .cell .prof{
    font-size: 11.5px;
    color: #A64B2A;
  }

  .cell.now-col{ outline: 2px solid var(--amber); outline-offset: -2px; }

  .cell.selected{
    border: 2px solid var(--ink);
    background: #DCE7FF;
    box-shadow: 0 4px 14px rgba(22,33,62,0.18);
  }
  .cell.selected .free-txt{ color: var(--ink); }
  .cell.selected .free-txt::before{ content: '✓ '; }

  .cell.taken{ cursor: default; }
  .cell.taken:hover{ box-shadow: none; transform:none; }

  .selection-bar{
    display:none;
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color:#fff;
    border-radius: 12px;
    padding: 12px 14px 12px 20px;
    box-shadow: 0 12px 30px rgba(22,33,62,0.35);
    align-items:center;
    gap: 18px;
    z-index: 40;
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }
  .selection-bar.show{ display:flex; }
  .selection-bar-actions{ display:flex; gap: 8px; }
  .selection-bar .btn{ flex: none; padding: 9px 14px; font-size:13px; }
  .selection-bar .btn-ghost{ color:#fff; border-color: rgba(255,255,255,0.35); }
  .selection-bar .btn-ghost:hover{ background: rgba(255,255,255,0.1); }

  /* Modal */
  .overlay{
    display:none;
    position: fixed; inset:0;
    background: rgba(22,33,62,0.45);
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.show{ display:flex; }

  .modal{
    background: var(--surface);
    border-radius: 16px;
    padding: 26px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(22,33,62,0.25);
  }
  .modal h2{
    font-family:'Sora', sans-serif;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .modal .modal-slot{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .modal label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  .modal input{
    width:100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
  }
  .modal input:focus{ outline: 2px solid var(--teal); border-color: var(--teal); }

  .modal-actions{
    display:flex; gap: 10px;
    margin-top: 22px;
  }
  .btn{
    flex:1;
    padding: 11px 14px;
    border-radius: 9px;
    border: none;
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor:pointer;
  }
  .btn-primary{ background: var(--ink); color:#fff; }
  .btn-primary:hover{ background:#0F1730; }
  .btn-danger{ background: var(--coral); color:#fff; }
  .btn-danger:hover{ background:#C64A26; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border:1.5px solid var(--border); }
  .btn-ghost:hover{ background: var(--bg); }

  .modal-error{
    display:none;
    background: var(--coral-soft);
    color:#9A3412;
    border-radius:8px;
    padding: 9px 11px;
    font-size: 13px;
    margin-top: 12px;
  }
  .modal-error.show{ display:block; }

</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="logo" src="logo-izquierdo.png" alt="Logo institución" onerror="this.style.display='none'">
    <div class="header-center">
      <div class="eyebrow">Sala de computación</div>
      <h1 id="titulo-semana">Horario semanal</h1>
      <p class="subtitle">Haz clic en una hora libre para reservarla con tu curso, o en una hora ocupada para liberarla.</p>
      <div class="legend" style="justify-content:center; margin-top:10px;">
        <span><i class="dot free"></i> Disponible</span>
        <span><i class="dot taken"></i> Reservada</span>
        <span><i class="dot now"></i> Bloque actual</span>
      </div>
    </div>
    <img class="logo" src="logo-escudo.png" alt="Escudo de la escuela" onerror="this.style.display='none'">
  </header>

  <div class="week-nav">
    <label for="selector-fecha">Ver semana de:</label>
    <input type="date" id="selector-fecha" onchange="irAFecha(this.value)">
    <button class="btn-week-today" onclick="irHoy()">Hoy</button>
  </div>

  <div id="status-banner"></div>

  <div class="board-shell">
    <table class="board" id="board"></table>
  </div>
</div>

<!-- Barra flotante de selección -->
<div class="selection-bar" id="selection-bar">
  <span id="selection-count">0 bloques seleccionados</span>
  <div class="selection-bar-actions">
    <button class="btn btn-ghost" onclick="limpiarSeleccion()">Limpiar</button>
    <button class="btn btn-primary" onclick="abrirReservar()">Reservar seleccionadas</button>
  </div>
</div>

<!-- Modal reservar -->
<div class="overlay" id="overlay-reservar">
  <div class="modal">
    <h2>Reservar horas</h2>
    <div class="modal-slot" id="reservar-slot"></div>

    <label for="input-curso">Curso que viene</label>
    <input type="text" id="input-curso" placeholder="Ej: 3° Básico A" />

    <label for="input-profesor-reserva">Tu nombre</label>
    <input type="text" id="input-profesor-reserva" placeholder="Ej: Profesora Ana Soto" />

    <div class="modal-error" id="error-reservar"></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModales()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarReserva()">Reservar</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN — ajusta esto a la realidad de tu colegio
// =====================================================================


// Pega aquí la URL /exec que te entrega Apps Script al implementar Code.gs
const API_URL = 'https://script.google.com/macros/s/AKfycbztMRpD4Z4iiZDBCE9J_94uTXqvUd_wqupDVa44fPZ7zT1PaewKnjXTusL1KdA1soxmXA/exec';

const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];

// Bloques horarios de 45 min — edita horas/cantidad según el horario real
const BLOQUES = [
  { n: 1,  inicio: '08:00', fin: '08:45' },
  { n: 2,  inicio: '08:45', fin: '09:30' },
  { n: 33,  inicio: '09:30', fin: '09:45', recreo: true },
  { n: 3,  inicio: '09:45', fin: '10:30' },
  { n: 4,  inicio: '10:30', fin: '11:15' },
  { n: 55,  inicio: '11:15', fin: '11:25', recreo: true },
  { n: 5,  inicio: '11:25', fin: '12:10' },
  { n: 6,  inicio: '12:10', fin: '12:55' },
  { n: 7,  inicio: '12:50', fin: '13:40' },
  { n: 8, inicio: '13:40', fin: '14:25' },
  { n: 9, inicio: '14:25', fin: '15:15' },
  { n: 100, inicio: '15:20', fin: '15:50', recreo: true },
  { n: 10, inicio: '15:50', fin: '16:35' },
  { n: 111, inicio: '16:35', fin: '16:45', recreo: true },
  { n: 11, inicio: '16:45', fin: '17:30' },
  { n: 12, inicio: '17:30', fin: '18:15' },
  { n: 13, inicio: '18:15', fin: '19:00' },
];

// =====================================================================

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let reservas = {}; // clave "FechaISO-Bloque" -> {curso, profesor, dia}
let seleccion = new Map(); // clave "FechaISO-Bloque" -> {fecha, dia, bloque, horaInicio, horaFin}
let semanaSeleccionada = lunesDe(new Date()); // Date — lunes de la semana que se muestra

function claveSlot(fechaISO, bloque){ return fechaISO + '-' + bloque; }

function lunesDe(fecha){
  const d = new Date(fecha);
  const dow = d.getDay(); // 0=domingo..6=sábado
  const offset = dow === 0 ? -6 : 1 - dow; // retrocede hasta el lunes
  d.setDate(d.getDate() + offset);
  d.setHours(0,0,0,0);
  return d;
}

function toISO(fecha){
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth() + 1).padStart(2, '0');
  const d = String(fecha.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function fechasSemana(lunes){
  return DIAS.map((_, i) => {
    const f = new Date(lunes);
    f.setDate(f.getDate() + i);
    return f;
  });
}

function formatearRangoSemana(lunes){
  const dias = fechasSemana(lunes);
  const inicio = dias[0], fin = dias[4];
  if (inicio.getMonth() === fin.getMonth()) {
    return `Semana del ${inicio.getDate()} al ${fin.getDate()} de ${MESES[inicio.getMonth()]}`;
  }
  if (inicio.getFullYear() === fin.getFullYear()) {
    return `Semana del ${inicio.getDate()} de ${MESES[inicio.getMonth()]} al ${fin.getDate()} de ${MESES[fin.getMonth()]}`;
  }
  return `Semana del ${inicio.getDate()} de ${MESES[inicio.getMonth()]} de ${inicio.getFullYear()} al ${fin.getDate()} de ${MESES[fin.getMonth()]} de ${fin.getFullYear()}`;
}

function irAFecha(valorInput){
  if (!valorInput) return;
  semanaSeleccionada = lunesDe(new Date(valorInput + 'T00:00:00'));
  cargarReservas();
}

function irHoy(){
  semanaSeleccionada = lunesDe(new Date());
  document.getElementById('selector-fecha').value = toISO(new Date());
  cargarReservas();
}

function bloqueActual(){
  const ahora = new Date();
  const mins = ahora.getHours() * 60 + ahora.getMinutes();
  for (const b of BLOQUES) {
    const [hi, mi] = b.inicio.split(':').map(Number);
    const [hf, mf] = b.fin.split(':').map(Number);
    const inicioMin = hi * 60 + mi, finMin = hf * 60 + mf;
    if (mins >= inicioMin && mins < finMin) return b.n;
  }
  return null;
}

function mostrarBanner(msg, esError){
  const el = document.getElementById('status-banner');
  el.textContent = msg;
  el.className = 'show' + (esError ? ' error' : '');
  clearTimeout(window._bannerTimeout);
  window._bannerTimeout = setTimeout(() => { el.className = ''; }, 4500);
}

async function cargarReservas(){
  document.getElementById('titulo-semana').textContent = formatearRangoSemana(semanaSeleccionada);
  try {
    const url = API_URL + '?semana=' + toISO(semanaSeleccionada);
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error desconocido');
    reservas = {};
    data.reservas.forEach(r => {
      reservas[claveSlot(r.fecha, r.bloque)] = { curso: r.curso, profesor: r.profesor, dia: r.dia };
    });
    let seleccionCambio = false;
    Array.from(seleccion.keys()).forEach(key => {
      if (reservas[key]) { seleccion.delete(key); seleccionCambio = true; }
    });
    if (seleccionCambio) {
      actualizarBarraSeleccion();
      mostrarBanner('Una de tus horas seleccionadas ya fue reservada por otro profesor y se quitó de la selección.', true);
    }
    dibujarTablero();
  } catch (err) {
    mostrarBanner('No se pudo cargar el horario. Revisa la conexión o la URL de la API. (' + err.message + ')', true);
  }
}

function dibujarTablero(){
  const hoyISO = toISO(new Date());
  const bloqueHoy = bloqueActual();
  const dias = fechasSemana(semanaSeleccionada);

  const table = document.getElementById('board');
  let html = '<thead><tr><th></th>';
  dias.forEach((f, i) => {
    const esHoy = toISO(f) === hoyISO;
    html += `<th class="day-header ${esHoy ? 'today' : ''}">${DIAS[i]}<br><span style="font-weight:500;font-size:12px;">${f.getDate()} ${MESES[f.getMonth()].slice(0,3)}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  BLOQUES.forEach(b => {
    if (b.recreo) {
      html += `<tr class="recreo-row"><td class="block-label recreo-label">${b.inicio}–${b.fin}</td>
        <td colspan="${dias.length}" class="recreo-cell">Recreo</td></tr>`;
      return;
    }
    html += `<tr><td class="block-label"><b>Bloque ${b.n}</b>${b.inicio}–${b.fin}</td>`;
    dias.forEach((f, i) => {
      const fechaISO = toISO(f);
      const key = claveSlot(fechaISO, b.n);
      const ocupado = reservas[key];
      const esAhora = (fechaISO === hoyISO && b.n === bloqueHoy);
      if (ocupado) {
        html += `<td>
          <div class="cell taken ${esAhora ? 'now-col' : ''}" title="Reservado por ${escapeHtml(ocupado.profesor)}">
            <div class="curso">${escapeHtml(ocupado.curso)}</div>
            <div class="prof">${escapeHtml(ocupado.profesor)}</div>
          </div>
        </td>`;
      } else {
        const marcado = seleccion.has(key);
        html += `<td>
          <div class="cell ${esAhora ? 'now-col' : ''} ${marcado ? 'selected' : ''}" onclick="toggleSeleccion('${fechaISO}', '${DIAS[i]}', ${b.n})">
            <div class="free-txt">Libre</div>
          </div>
        </td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody>';
  table.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function bloqueInfo(n){ return BLOQUES.find(b => b.n === n); }

function toggleSeleccion(fechaISO, dia, bloque){
  const key = claveSlot(fechaISO, bloque);
  if (seleccion.has(key)) {
    seleccion.delete(key);
  } else {
    const info = bloqueInfo(bloque);
    seleccion.set(key, { fecha: fechaISO, dia, bloque, horaInicio: info.inicio, horaFin: info.fin });
  }
  dibujarTablero();
  actualizarBarraSeleccion();
}

function limpiarSeleccion(){
  seleccion.clear();
  dibujarTablero();
  actualizarBarraSeleccion();
}

function actualizarBarraSeleccion(){
  const barra = document.getElementById('selection-bar');
  const n = seleccion.size;
  document.getElementById('selection-count').textContent =
    n === 1 ? '1 hora seleccionada' : `${n} horas seleccionadas`;
  barra.classList.toggle('show', n > 0);
}

function formatearFechaCorta(fechaISO){
  const [y, m, d] = fechaISO.split('-');
  return `${d}/${m}`;
}

function abrirReservar(){
  if (seleccion.size === 0) return;

  const lista = Array.from(seleccion.values())
    .sort((a, b) => (a.fecha + a.bloque).localeCompare(b.fecha + b.bloque))
    .map(s => `${s.dia} ${formatearFechaCorta(s.fecha)} · Bloque ${s.bloque} (${s.horaInicio}–${s.horaFin})`)
    .join('<br>');

  document.getElementById('reservar-slot').innerHTML = lista;
  document.getElementById('input-curso').value = '';
  document.getElementById('input-profesor-reserva').value = '';
  document.getElementById('error-reservar').className = 'modal-error';
  document.getElementById('overlay-reservar').classList.add('show');
}

function cerrarModales(){
  document.getElementById('overlay-reservar').classList.remove('show');
}

async function enviarPost(payload){
  // Content-Type text/plain evita el preflight CORS que Apps Script no maneja bien
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function confirmarReserva(){
  const curso = document.getElementById('input-curso').value.trim();
  const profesor = document.getElementById('input-profesor-reserva').value.trim();
  const errorEl = document.getElementById('error-reservar');

  if (!curso || !profesor) {
    errorEl.textContent = 'Completa el curso y tu nombre.';
    errorEl.className = 'modal-error show';
    return;
  }
  if (seleccion.size === 0) {
    errorEl.textContent = 'Selecciona al menos una hora en la grilla.';
    errorEl.className = 'modal-error show';
    return;
  }

  const payload = {
    slots: Array.from(seleccion.values()),
    curso, profesor
  };

  try {
    const data = await enviarPost(payload);
    if (!data.ok) {
      errorEl.textContent = data.error || 'No se pudo reservar.';
      errorEl.className = 'modal-error show';
      return;
    }
    cerrarModales();
    seleccion.clear();
    actualizarBarraSeleccion();
    mostrarBanner('Reserva guardada correctamente para ' + curso + '.', false);
    cargarReservas();
  } catch (err) {
    errorEl.textContent = 'Error de conexión. Intenta de nuevo.';
    errorEl.className = 'modal-error show';
  }
}

document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => { if (e.target === ov) cerrarModales(); });
});

document.getElementById('selector-fecha').value = toISO(new Date());
cargarReservas();
setInterval(cargarReservas, 30000); // refresca cada 30s por si otro profe reserva
</script>
